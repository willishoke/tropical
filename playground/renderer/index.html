<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tropical / night scene</title>
<style>
  * { box-sizing: border-box; }

  :root {
    color-scheme: dark;
    --ground: #0b0f12;
    --surface: #11171b;
    --raised: #161d21;
    --rule: #293238;
    --rule-live: #42514f;
    --text: #cbd3d0;
    --muted: #71807d;
    --strings: #72b6a1;
    --room: #d49a6a;
    --mode-1: #72b6a1;
    --mode-2: #d5c66f;
    --mode-3: #d49a6a;
    --mode-4: #8fa7d1;
    --mode-5: #bd8fb4;
    --focus: #d5c66f;
    --fault: #c27386;
    --ink-black: #070a0c;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-width: 840px;
    min-height: 620px;
    overflow: hidden;
    background: var(--ground);
    color: var(--text);
    font: 12px/1.35 "SFMono-Regular", "SF Mono", "Cascadia Mono",
      "Liberation Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  button, input { font: inherit; }
  button { color: inherit; }

  #frame {
    height: 100%;
    display: grid;
    grid-template-rows: auto auto minmax(170px, 0.86fr) minmax(250px, 1.14fr) auto;
    gap: 10px;
    padding: 13px 15px 11px;
  }

  #masthead,
  .section-head,
  .scope-head,
  #transport {
    display: flex;
    align-items: center;
  }

  #masthead {
    min-height: 28px;
    gap: 14px;
    border-bottom: 1px solid var(--rule);
    padding: 0 1px 8px;
  }

  #mark {
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.15em;
  }

  #scene-name {
    color: var(--strings);
    letter-spacing: 0.09em;
  }

  #status {
    margin-left: auto;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  #status.fault { color: var(--fault); }

  .section-head {
    justify-content: space-between;
    min-height: 22px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  #sequence { min-height: 0; }

  #steps {
    display: grid;
    grid-template-columns: repeat(16, minmax(0, 1fr));
    gap: 4px;
  }

  .step {
    position: relative;
    min-width: 0;
    height: 31px;
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 5px 3px 4px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    outline: none;
  }

  .step::after {
    content: "";
    position: absolute;
    left: 5px;
    right: 5px;
    bottom: 3px;
    height: 1px;
    background: transparent;
  }

  .step.downbeat {
    border-color: var(--rule-live);
    color: var(--text);
  }

  .step.downbeat::after { background: var(--strings); }
  .step:hover { border-color: var(--strings); color: var(--text); }
  .step:focus-visible { border-color: var(--focus); }

  .step.active {
    border-color: var(--focus);
    background: color-mix(in srgb, var(--focus) 12%, var(--surface));
    color: var(--focus);
  }

  .step .ordinal {
    display: block;
    overflow: hidden;
    text-align: center;
    text-overflow: clip;
    white-space: nowrap;
  }

  #chord-strip {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    padding-top: 7px;
  }

  .chord {
    min-width: 0;
    border: 0;
    border-left: 2px solid var(--rule-live);
    border-radius: 0;
    padding: 2px 8px 3px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    outline: none;
  }

  .chord:hover, .chord:focus-visible { border-left-color: var(--focus); }
  .chord.active { border-left-color: var(--strings); }

  .chord-name {
    display: block;
    color: var(--text);
    font-size: 11px;
  }

  .chord-ratios {
    display: block;
    overflow: hidden;
    margin-top: 1px;
    color: var(--muted);
    font-size: 9px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #scopes {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
    min-height: 0;
  }

  .scope {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 27px minmax(0, 1fr);
    border: 1px solid var(--rule);
    background: var(--surface);
  }

  .scope-head {
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--rule);
    padding: 0 9px;
    font-size: 10px;
    letter-spacing: 0.07em;
  }

  .scope-meta {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0;
    white-space: nowrap;
  }

  .scope canvas {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  #controls {
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid var(--rule);
    background: var(--surface);
  }

  .control {
    display: grid;
    grid-template-columns: 128px minmax(180px, 1fr) 88px minmax(190px, 0.75fr);
    align-items: center;
    min-height: 35px;
    border-bottom: 1px solid var(--rule);
    padding: 0 10px;
    cursor: default;
  }

  .control.selected {
    background: var(--raised);
    box-shadow: inset 2px 0 var(--focus);
  }

  .control-label {
    color: var(--text);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .control-value {
    padding-left: 12px;
    color: var(--strings);
    text-align: right;
  }

  .control.transport-control .control-value { color: var(--focus); }

  .control-help {
    overflow: hidden;
    padding-left: 18px;
    color: var(--muted);
    font-size: 9px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  input[type="range"] {
    width: 100%;
    height: 20px;
    margin: 0;
    padding: 0;
    appearance: none;
    background: transparent;
    cursor: ew-resize;
    outline: none;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    background:
      linear-gradient(to right,
        var(--strings) 0 var(--fill),
        var(--rule-live) var(--fill) 100%);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 7px;
    height: 16px;
    margin-top: -7px;
    appearance: none;
    border: 0;
    border-radius: 0;
    background: var(--text);
  }

  input[type="range"]:focus-visible::-webkit-slider-thumb {
    background: var(--focus);
  }

  #transport {
    min-height: 34px;
    gap: 7px;
    border-top: 1px solid var(--rule);
    padding-top: 9px;
  }

  .transport-button {
    height: 25px;
    border: 1px solid var(--rule);
    border-radius: 0;
    padding: 0 9px;
    background: var(--surface);
    cursor: pointer;
    outline: none;
  }

  .transport-button:hover { border-color: var(--strings); }
  .transport-button:focus-visible { border-color: var(--focus); }
  #play-button { min-width: 86px; color: var(--focus); }

  #clock {
    margin-left: auto;
    color: var(--text);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  #clock .dim, #tail-state { color: var(--muted); }

  #help {
    margin-left: 10px;
    color: var(--muted);
    font-size: 9px;
    white-space: nowrap;
  }

  @media (max-height: 730px) {
    #frame {
      grid-template-rows: auto auto minmax(145px, 0.78fr) minmax(245px, 1.22fr) auto;
      gap: 7px;
      padding-top: 9px;
    }
    .control { min-height: 32px; }
    .chord-ratios { display: none; }
  }
</style>
</head>
<body>
  <main id="frame">
    <header id="masthead">
      <span id="mark">TROPICAL</span>
      <span>/</span>
      <span id="scene-name">NIGHT SCENE 01</span>
      <span id="status">preparing strings + wet metal…</span>
    </header>

    <section id="sequence" aria-label="Scene sequence">
      <div class="section-head">
        <span>one scene / sixteen moments</span>
        <span id="tail-state">16 s / closed circuit</span>
      </div>
      <div id="steps"></div>
      <div id="chord-strip"></div>
    </section>

    <section id="scopes" aria-label="Signal scopes"></section>
    <section id="controls" aria-label="Scene controls"></section>

    <footer id="transport">
      <button class="transport-button" id="restart-button" type="button">↤ 00</button>
      <button class="transport-button" id="reverse-button" type="button">REV</button>
      <button class="transport-button" id="play-button" type="button">Ⅱ HOLD</button>
      <span id="clock"><span class="dim">τ</span> 00.000 / 16.000</span>
      <span id="help">↑↓ row · ←→ move · shift fine · click any moment</span>
    </footer>
  </main>

  <script src="../scene.js"></script>
  <script src="latest-value-sender.js"></script>
  <script src="phase-lock.js"></script>
  <script src="scope-view.js"></script>
  <script src="scope-frame.js"></script>
  <script src="scope-profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
