name: CI

on:
  pull_request:
    branches: [main]

jobs:
  reversible:
    name: Reversible Swift build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build native app package
        run: swift build --package-path reversible
      - name: Test native app package
        run: swift test --package-path reversible

  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run tsc --noEmit

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The Lean binaries (frontend/diffcli/tropicaltest) link libtropical via an
    # @executable_path rpath, which is macOS-only; on Linux the runtime loader
    # finds libtropical.so through LD_LIBRARY_PATH instead.
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM 22 + lld and ALSA headers
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # lld-22 = wasm-ld; liblld-22-dev = lld's static libs + headers
          # (lld::wasm::link) for the in-process IR→wasm emitter.
          # libpolly-22-dev: apt's LLVM links Polly into the pass pipeline, so
          # the in-process wasm emitter's static LTO link needs Polly's archives.
          sudo apt-get install -y lld-22 liblld-22-dev libpolly-22-dev libasound2-dev

      - name: Build libtropical (with in-process wasm emit)
        run: |
          cmake -S . -B build \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DTROPICAL_BUILD_PYTHON=OFF \
            -DTROPICAL_PROFILE=OFF \
            -DTROPICAL_WASM_EMIT=ON
          cmake --build build -j$(nproc)

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v1
      - run: bun install

      - name: Build the Lean frontend + harness (production compiler/MCP server)
        run: |
          cd lean
          lake env leanc -c ffi/shim.c -o ffi/shim.o -I ../engine/c_api
          lake build frontend diffcli tropicaltest trustreport

      - name: Audit typed trust sites against production Lean
        run: python3 tools/audit_trust_sites.py

      - name: Golden + native-equiv runner
        run: ./lean/.lake/build/bin/tropicaltest

      - name: Precompile web demo plans (Lean-driven)
        run: bun web/build_patches.ts

      - name: Behavioral + WASM≡JIT suites (against the Lean engine)
        run: TROPICAL_ENGINE_CMD="./lean/.lake/build/bin/frontend --rpc" bun test

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
