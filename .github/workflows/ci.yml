name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run tsc --noEmit

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The Lean binaries (frontend/diffcli/tropicaltest) link libtropical via an
    # @executable_path rpath, which is macOS-only; on Linux the runtime loader
    # finds libtropical.so through LD_LIBRARY_PATH instead.
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM 20 and ALSA headers
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y libasound2-dev

      - name: Build libtropical
        run: |
          cmake -S . -B build \
            -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm \
            -DTROPICAL_BUILD_PYTHON=OFF \
            -DTROPICAL_PROFILE=OFF
          cmake --build build -j$(nproc)

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: oven-sh/setup-bun@v1
      - run: bun install

      - name: Build the Lean frontend + harness (production compiler/MCP server)
        run: |
          cd lean
          lake env leanc -c ffi/shim.c -o ffi/shim.o -I ../engine/c_api
          lake build frontend diffcli tropicaltest

      - name: Golden + native-equiv runner
        run: ./lean/.lake/build/bin/tropicaltest

      - name: Precompile web demo plans (Lean-driven)
        run: bun web/build_patches.ts

      - name: Behavioral + WASM≡JIT suites (against the Lean engine)
        run: TROPICAL_ENGINE_CMD="./lean/.lake/build/bin/frontend --rpc" bun test

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
