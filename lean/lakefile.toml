name = "tropical_frontend"
defaultTargets = ["frontend"]

# The Turnstile MCP framework, pulled cross-repo. Must share the toolchain
# pinned in lean-toolchain (v4.29.1).
[[require]]
name = "turnstile"
git = "https://github.com/willishoke/turnstile"
rev = "main"

# The Tropical libraries, layered so dependencies point inward. Membership
# is by glob; the allowed direction between libraries is enforced by
# `tools/check_layers.py` (run by `make validate`):
#
#   TropicalCore     the compiler: IR, lowering, emitters, semantics, the
#                    pure session compile. Imports nothing outside itself.
#                    Includes the host port the engine drives.
#   TropicalHost     the runtime binding (Ffi), its HostPort adapter, and
#                    the staged loaders.
#   TropicalSession  the session engine and its MCP tools, resources and
#                    RPC dispatch. Imports only the core: it reaches the
#                    runtime through the port, never through Ffi.
#   TropicalApp      composition roots: native boot, the MCP front door,
#                    the control socket.
#   TropicalTest     proofs, witnesses, the tropicaltest suites.
#
# Executable roots below may import any layer; only they link libtropical.
[[lean_lib]]
name = "TropicalCore"
globs = [
  "Tropical.Artifact",
  "Tropical.Compile",
  "Tropical.EmitArrow.*",
  "Tropical.Entries",
  "Tropical.Errors",
  "Tropical.Exact.*",
  "Tropical.Expr",
  "Tropical.HostPort",
  "Tropical.Ir.+",
  "Tropical.Lowering",
  "Tropical.Parse.+",
  "Tropical.Plan",
  "Tropical.PlanDecode",
  "Tropical.Playground.*",
  "Tropical.Semantics.*",
  "Tropical.Session.*",
  "Tropical.Stdlib",
  "Tropical.StdlibChain",
  "Tropical.WireExpr",
  "Tropical.Wiring",
]

[[lean_lib]]
name = "TropicalHost"
globs = ["Tropical.Ffi", "Tropical.NativeHost", "Tropical.StagedLoad"]

[[lean_lib]]
name = "TropicalSession"
globs = [
  "Tropical.Engine.*",
  "Tropical.Resources",
  "Tropical.Rpc",
  "Tropical.Tools",
]

[[lean_lib]]
name = "TropicalApp"
globs = [
  "Tropical",
  "Tropical.Frontend",
  "Tropical.NativeBoot",
  "Tropical.Serve",
]

[[lean_lib]]
name = "TropicalTest"
globs = [
  "Tropical.Proofs",
  "Tropical.Testing.+",
  "Tropical.Trust",
  "Tropical.Tropicaltest.+",
]

# Native link: the FFI shim object (built by `make lean` via leanc) and
# libtropical from the CMake build. Paths are relative to this package
# dir; the rpath resolves @rpath/libtropical.dylib from the installed
# binary location (lean/.lake/build/bin/ → ../../../../build).
[[lean_exe]]
name = "frontend"
root = "Main"
moreLinkArgs = [
  "ffi/shim.o",
  "-L../build", "-ltropical",
  "-Wl,-rpath,@executable_path/../../../../build",
]

# Differential-harness verbs over the Lean-owned native runtime
# (render-bytes → golden-hash gate).
[[lean_exe]]
name = "diffcli"
root = "Diffcli"
moreLinkArgs = [
  "ffi/shim.o",
  "-L../build", "-ltropical",
  "-Wl,-rpath,@executable_path/../../../../build",
]

# Post-TS golden + native-equiv runner (Phase 8): renders patches via the
# Lean FFI, hashes against the frozen goldens, and cross-checks the native
# compilation modes. The replacement for validate_stdlib + the equiv suite.
[[lean_exe]]
name = "tropicaltest"
root = "Tropicaltest"
moreLinkArgs = [
  "ffi/shim.o",
  "-L../build", "-ltropical",
  "-Wl,-rpath,@executable_path/../../../../build",
]

[[lean_exe]]
name = "trustreport"
root = "TrustReport"

# The compiler alone: a patch to a kernel artifact with no runtime linked.
# tools/check_layers.py keeps its import closure inside TropicalCore;
# tools/check_artifact_parity.py checks its plans against the engine's.
[[lean_exe]]
name = "tropicalc"
root = "Tropicalc"

# The core test tier: the gates that are statements about the compiler
# alone, run with no runtime linked. tools/check_layers.py keeps its import
# closure inside TropicalCore and TropicalTest.
[[lean_exe]]
name = "tropicaltest-core"
root = "TropicaltestCore"

# Focused modal-phaser qualification runner.  Keeping this gate separate avoids
# paying the full tropicaltest module-initialization cost during product-layout
# iteration; the same gate is also called by the repository-wide runner.
[[lean_exe]]
name = "phasercheck"
root = "Phasercheck"
moreLinkArgs = [
  "ffi/shim.o",
  "-L../build", "-ltropical",
  "-Wl,-rpath,@executable_path/../../../../build",
]
